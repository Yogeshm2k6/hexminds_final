services:
  # ========================================================
  # 1. HexaMinds Python ArcFace Biometrics Backend Service
  # ========================================================
  - type: web
    name: hexminds-final-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn biometrics_service:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/biometrics/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: ARCFACE_MATCH_THRESHOLD
        value: "0.52"
      - key: LIVENESS_THRESHOLD
        value: "0.48"
      - key: CONSISTENCY_FRAMES
        value: "2"

  # ========================================================
  # 2. HexaMinds AI Proctoring Frontend Web Portal
  # ========================================================
  - type: static
    name: hexminds-final-frontend
    plan: free
    region: oregon
    buildCommand: echo "HexaMinds static build ready"
    publishPath: .
    routes:
      - type: rewrite
        source: /exam
        destination: /exam.html
      - type: rewrite
        source: /
        destination: /index.html
